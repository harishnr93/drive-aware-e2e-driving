# Model B: frozen model-A encoder + GRU over H frames (Phase 5). Pass the encoder per seed:
#   --set seed=k encoder_checkpoint=experiments/<ts>_model_a_seed<k>/best.pt
name: model_b
model: temporal
data_root: data/expert_v1
seed: 0
history: 4
history_stride: 1
epochs: 30
batch_size: 256
lr: 1.0e-3
weight_decay: 1.0e-4
stationary_weight: 0.3
temporal:
  speed_history: false
  freeze_encoder: true
