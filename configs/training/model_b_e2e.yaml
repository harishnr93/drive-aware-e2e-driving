# Ablation: model B trained end to end (encoder initialised from model A and fine-tuned).
#   --set encoder_checkpoint=experiments/<ts>_model_a_seed0/best.pt
name: ablate_b_e2e
model: temporal
data_root: data/expert_v1
seed: 0
history: 4
history_stride: 1
epochs: 12
batch_size: 32
lr: 3.0e-4
weight_decay: 1.0e-4
workers: 4
stationary_weight: 0.3
temporal:
  speed_history: false
  freeze_encoder: false
