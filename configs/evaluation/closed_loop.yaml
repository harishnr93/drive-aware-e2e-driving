# Closed-loop scenario sets. Maps match the dataset splits (no new maps); route and traffic
# seeds are derived independently of the dataset's, so the routes driven are new.
route_length: 300.0
max_duration: 150.0
seed: 0
sets:
  val:     {map_seed_start: 2000, num_maps: 6,  routes_per_map: 5}
  test_id: {map_seed_start: 3000, num_maps: 10, routes_per_map: 15}  # 150 routes from Phase 5 (Phase 4 used the first 5 per map)
  # Phase 6 introspection rollouts (reserved map ranges; disjoint from all BC data splits)
  intro_train: {map_seed_start: 4000, num_maps: 16, routes_per_map: 10}
  intro_val:   {map_seed_start: 4016, num_maps: 4,  routes_per_map: 10}
  intro_cal:   {map_seed_start: 5000, num_maps: 6,  routes_per_map: 10}
